name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  panel-tests:
    name: Panel (pytest)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: panel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: panel/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  shell:
    name: Scripts (shellcheck + aislamiento con tráfico real)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -S warning wg-manager.sh install.sh tests/firewall_netns_test.sh
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq iproute2 iptables iputils-ping
      - run: sudo bash tests/firewall_netns_test.sh

  image:
    name: Imagen Docker del panel
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t wgp-panel:ci panel
      - name: Arranque y healthcheck
        run: |
          mkdir -p /tmp/wgp/data /tmp/wgp/wg
          docker run -d --name wgp --network host \
            -e PANEL_PORT=5000 -e WG_ENDPOINT=203.0.113.10 -e SESSION_SECRET=ci \
            -v /tmp/wgp/data:/data -v /tmp/wgp/wg:/etc/wireguard wgp-panel:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:5000/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:5000/ | grep -q 'WireGuard Cloud'
          sudo test -s /tmp/wgp/wg/wg0.conf
          docker exec wgp wg --version
          docker logs wgp
